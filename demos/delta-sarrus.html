<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delta Robot with Integrated Gripper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital@0;1&display=swap">
<style>
:root{
  --bg:#eef0ee; --panel:#f8f9f7; --fg:#1d2321; --muted:#5d6763; --line:#cfd5d1;
  --stage:#e3e7e4; --gridA:#9aa6a0; --gridB:#c4ccc8;
  --legA:#c2453a; --legB:#2f62b5; --plat:#2a2f2d; --accent:#b8730f; --mech:#7a4cb0; --ped:#b9c1bc; --ok:#3b8a4f; --bad:#c2453a;
  --f-display:"Archivo",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace; --f-math:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --panel:#1b211f; --fg:#e4e9e6; --muted:#97a39d; --line:#2f3834;
  --stage:#101413; --gridA:#4a5651; --gridB:#2a3330;
  --legA:#e0675b; --legB:#5f8fe0; --plat:#d9dfdb; --accent:#e5a13c; --mech:#a986e3; --ped:#39433f; --ok:#5cb874; --bad:#e0675b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b211f; --fg:#e4e9e6; --muted:#97a39d; --line:#2f3834;
  --stage:#101413; --gridA:#4a5651; --gridB:#2a3330;
  --legA:#e0675b; --legB:#5f8fe0; --plat:#d9dfdb; --accent:#e5a13c; --mech:#a986e3; --ped:#39433f; --ok:#5cb874; --bad:#e0675b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-display);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.02em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);max-width:72ch}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{font-size:14px;padding:10px 14px}
.main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.stage{position:relative;background:var(--stage);border:1px solid var(--line);border-radius:6px;overflow:hidden;aspect-ratio:4/3;max-width:100%;touch-action:none}
@media (max-width:860px){.stage{aspect-ratio:1/1}}
.stage canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:10px;bottom:8px;font:12px var(--f-mono);color:var(--muted);pointer-events:none}
.phase{position:absolute;right:10px;top:8px;font:600 12px var(--f-mono);color:var(--accent);pointer-events:none}
.panel{display:grid;gap:16px;min-width:0}
.block{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:12px;min-width:0}
.lbl{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ctl{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center}
.ctl .tag{font:600 15px var(--f-math);font-style:italic}
.ctl output{font:13px var(--f-mono);font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:600 13px var(--f-display);padding:8px 12px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:13px var(--f-mono);font-variant-numeric:tabular-nums}
.pill{font:600 11px var(--f-mono);padding:2px 8px;border-radius:999px;color:var(--bg);background:var(--ok)}
.pill.bad{background:var(--bad)}
.note{color:var(--muted);font-size:14px;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font:12px var(--f-mono);color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:-1px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Delta Robot with Integrated Gripper</h1>
    <p>Four base-mounted motors. The gripper opens and closes through the relative motion of the two plates.</p>
  </header>

  <div class="main">
    <div>
      <div class="stage" id="stage"><span class="hint">drag to rotate · scroll to zoom</span><span class="phase" id="phase"></span></div>
      <div class="legend">
        <span style="--c:var(--legA)">Legs 1, 2 · plate A</span>
        <span style="--c:var(--legB)">Legs 3, 4 · plate B</span>
        <span style="--c:var(--mech)">Sarrus linkage</span>
      </div>
    </div>

    <div class="panel">
      <div class="block">
        <div class="ctl"><span class="tag">x</span><input id="sx" type="range" min="-110" max="110" step="1" aria-label="x"><output id="ox"></output></div>
        <div class="ctl"><span class="tag">y</span><input id="sy" type="range" min="-110" max="110" step="1" aria-label="y"><output id="oy"></output></div>
        <div class="ctl"><span class="tag">z</span><input id="sz" type="range" min="-440" max="-290" step="1" aria-label="z"><output id="oz"></output></div>
        <div class="ctl"><span class="tag">δ</span><input id="sg" type="range" min="12" max="70" step="0.5" aria-label="gripper opening"><output id="og"></output></div>
        <div class="row">
          <button id="play" aria-pressed="false">Pick and place</button>
          <button id="reset">Reset</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const RB=180, LA=160, LB=380, PW=30, R=5, FL=130, OBJ=30;
const GAM=[180,270,0,90].map(d=>d*Math.PI/180);
const LS=40;      
const MODES=[{gmin:12,gmax:70}];
let mode=0;


function relB(g){return {d:V(g+18,0,0),th:0};}
function gapCenterOff(g){return 9+g/2;}

const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,10,20000);
scene.add(new THREE.HemisphereLight(0xffffff,0x667070,0.75));
const dl=new THREE.DirectionalLight(0xffffff,0.75);dl.position.set(700,1400,900);scene.add(dl);
const robot=new THREE.Group();robot.rotation.x=-Math.PI/2;robot.position.y=640;scene.add(robot);
const css=()=>getComputedStyle(document.documentElement);
const col=n=>new THREE.Color(css().getPropertyValue(n).trim());
const mats={};['--legA','--legB','--plat','--accent','--mech','--ped'].forEach(k=>mats[k]=new THREE.MeshStandardMaterial({roughness:.5,metalness:.15}));
const frameMat=new THREE.MeshStandardMaterial({roughness:.7,metalness:.1});
const plateMat=new THREE.MeshStandardMaterial({roughness:.7,metalness:.1,transparent:true,opacity:.45});
let grid;
function applyTheme(){scene.background=col('--stage');for(const k in mats)mats[k].color=col(k);frameMat.color=col('--gridA');plateMat.color=col('--gridA');
  if(grid)scene.remove(grid);grid=new THREE.GridHelper(1000,20,col('--gridA'),col('--gridB'));scene.add(grid);}
const Yax=new THREE.Vector3(0,1,0);
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const box=(x,y,z,m)=>new THREE.Mesh(new THREE.BoxGeometry(x,y,z),m);
const sph=(r,m)=>new THREE.Mesh(new THREE.SphereGeometry(r,14,10),m);
function cyl(r,m){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,18),m)}
function place(m,a,b){const d=b.clone().sub(a);const L=d.length();m.position.copy(a).addScaledVector(d,.5);m.scale.set(1,Math.max(L,1e-3),1);if(L>1e-6)m.quaternion.setFromUnitVectors(Yax,d.normalize());}
const base=new THREE.Mesh(new THREE.CylinderGeometry(RB+40,RB+40,14,48),plateMat);base.rotation.x=Math.PI/2;base.position.z=24;robot.add(base);
[[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([a,b])=>{const p=cyl(10,frameMat);place(p,V(a*260,b*260,-640),V(a*260,b*260,30));robot.add(p);});

const legs=GAM.map((g,i)=>{
  const m=mats[i<2?'--legA':'--legB'];
  const er=V(Math.cos(g),Math.sin(g),0),u=V(-Math.sin(g),Math.cos(g),0),B=er.clone().multiplyScalar(RB);
  const motor=cyl(24,mats['--plat']);place(motor,B.clone().addScaledVector(u,-28),B.clone().addScaledVector(u,28));
  const arm=cyl(9,m),bars=[cyl(R,m),cyl(R,m)],balls=[0,1,2,3].map(()=>sph(7,mats['--plat'])),elb=cyl(5,m),wr=cyl(5,m);
  [motor,arm,...bars,...balls,elb,wr].forEach(o=>robot.add(o));
  return {er,u,B,arm,bars,balls,elb,wr};
});


const plateA=box(10,80,70,mats['--plat']),plateB=box(10,80,70,mats['--plat']);robot.add(plateA);robot.add(plateB);
const lugs=[0,1,2,3].map(()=>{const m=cyl(4,mats['--plat']);robot.add(m);return m;});
const fA=box(8,22,1,mats['--plat']),fB=box(8,22,1,mats['--plat']);robot.add(fA);robot.add(fB);
const padA=box(4,20,24,mats['--accent']),padB=box(4,20,24,mats['--accent']);robot.add(padA);robot.add(padB);
const mech=new THREE.Group();robot.add(mech);
const pool=[];let poolI=0;
function bar(r,a,b,m){let o=pool[poolI++];if(!o){o=cyl(1,mats['--mech']);mech.add(o);pool.push(o);}o.visible=true;o.material=m||mats['--mech'];o.scale.set(r,1,r);place(o,a,b);o.scale.x=o.scale.z=r;return o;}
function hinge(p,dir){return bar(5,p.clone().addScaledVector(dir,-9),p.clone().addScaledVector(dir,9),mats['--accent']);}

const st={x:0,y:0,z:-360,g:50};
function plates(s){const A=V(s.x,s.y,s.z);const r=relB(s.g);return {A,B:A.clone().add(r.d),th:r.th};}
function attach(s){const {A,B}=plates(s);return GAM.map((g,i)=>(i<2?A:B).clone().add(V(32*Math.cos(g),32*Math.sin(g),45)));}
function solveLeg(L,C){const r=C.clone().sub(L.B);const rho=r.dot(L.er),t=r.dot(L.u),w=r.z;
  const K=(rho*rho+w*w+t*t+LA*LA-LB*LB)/(2*LA),Rr=Math.hypot(rho,w);if(Math.abs(K)>Rr)return null;
  const ph=Math.atan2(w,rho),ac=Math.acos(K/Rr);
  return [ac-ph,-ac-ph].map(a=>({a,E:L.B.clone().addScaledVector(L.er,LA*Math.cos(a)).add(V(0,0,-LA*Math.sin(a)))})).sort((p,q)=>q.E.dot(L.er)-p.E.dot(L.er))[0];}
function ik(s){const C=attach(s);const out=[];for(let i=0;i<4;i++){const r=solveLeg(legs[i],C[i]);if(!r)return null;out.push({...r,C:C[i]});}return out;}
function qOf(s){const r=ik(s);return r?r.map(o=>o.a):null;}

function render3D(sol){
  sol.forEach((o,i)=>{const L=legs[i];place(L.arm,L.B,o.E);const v=L.u.clone().multiplyScalar(PW/2);
    const ends=[[o.E.clone().add(v),o.C.clone().add(v)],[o.E.clone().sub(v),o.C.clone().sub(v)]];
    ends.forEach(([a,b],k)=>{place(L.bars[k],a,b);L.balls[2*k].position.copy(a);L.balls[2*k+1].position.copy(b);});
    place(L.elb,ends[0][0],ends[1][0]);place(L.wr,ends[0][1],ends[1][1]);});
  const {A,B,th}=plates(st);
  plateA.position.copy(A);plateB.position.copy(B);
  const C=attach(st);C.forEach((c,i)=>place(lugs[i],(i<2?A:B).clone().add(V(0,0,30)),c));
  
  const tipZ=A.z-FL;
  const xa=A.x+5,xb=B.x-5;
  fA.position.set(xa,A.y,(A.z-35+tipZ)/2);fA.scale.z=A.z-35-tipZ;
  const bTop=B.z-35;fB.position.set(xb,B.y,(bTop+tipZ)/2);fB.scale.z=Math.max(1,bTop-tipZ);
  padA.position.set(A.x+9,A.y,tipZ+12);
  padB.position.set(B.x-9,B.y,tipZ+12);
  
  poolI=0;pool.forEach(o=>o.visible=false);
  {
    const dx=B.x-A.x-10,h=Math.sqrt(Math.max(0,LS*LS-dx*dx/4));
    const a1=V(A.x+5,A.y,A.z+20),b1=V(B.x-5,B.y,B.z+20),m1=V((a1.x+b1.x)/2,A.y,A.z+20+h);
    bar(4,a1,m1);bar(4,m1,b1);[a1,m1,b1].forEach(p=>hinge(p,V(0,1,0)));
    const a2=V(A.x+5,A.y+30,A.z-15),b2=V(B.x-5,B.y+30,B.z-15),m2=V((a2.x+b2.x)/2,A.y+30+h,A.z-15);
    bar(4,a2,m2);bar(4,m2,b2);[a2,m2,b2].forEach(p=>hinge(p,V(0,0,1)));
  }
  if(grasped)objPos=A.clone().add(objOff);
  obj.position.copy(objPos);
  return B.z-A.z;
}


const OBJZ=-525;
const PED=[V(-90,40,0),V(90,-40,0)];
PED.forEach(P=>{const h=640+OBJZ-OBJ/2;const m=box(50,50,h,mats['--ped']);m.position.set(P.x,P.y,-640+h/2);robot.add(m);});
const obj=box(OBJ,OBJ,OBJ,mats['--accent']);robot.add(obj);
let objPos=V(PED[0].x,PED[0].y,OBJZ),grasped=false,objOff=V();
const ZGRASP=OBJZ+FL-12;


const sl={x:sx,y:sy,z:sz},out={x:ox,y:oy,z:oz};
function sync(){
  for(const k in sl){sl[k].value=st[k];out[k].textContent=st[k].toFixed(0)+' mm';}
  sg.value=st.g;og.textContent=st.g.toFixed(0)+' mm';
  const sol=ik(st);if(sol)render3D(sol);
}
function setMode(m){mode=m;const M=MODES[m];sg.min=M.gmin;sg.max=M.gmax;
  stopPlay();grasped=false;objPos=V(PED[0].x,PED[0].y,OBJZ);st.g=Math.min(M.gmax,Math.max(M.gmin,st.g));if(!ik(st))Object.assign(st,{x:0,y:0,z:-360});sync();}
function tryMove(k,v){const t={...st,[k]:v};if(ik(t))st[k]=v;}
['x','y','z'].forEach(k=>sl[k].addEventListener('input',()=>{stopPlay();tryMove(k,+sl[k].value);sync();}));
sg.addEventListener('input',()=>{stopPlay();let v=+sg.value;if(grasped)v=Math.max(v,OBJ);if(grasped&&v>OBJ+1)grasped=false;tryMove('g',v);if(!grasped&&canGrab())grab();sync();});
function canGrab(){const cx=st.x+gapCenterOff(st.g);return Math.abs(cx-objPos.x)<6&&Math.abs(st.y-objPos.y)<6&&Math.abs(st.z-ZGRASP)<8&&st.g<=OBJ+0.5;}
function grab(){grasped=true;objOff=objPos.clone().sub(V(st.x,st.y,st.z));}

const phaseEl=document.getElementById('phase'),playBtn=document.getElementById('play');
let playing=false,seq=[],segI=0,segT=0,from=null,which=0;
const ZUP=-320;
function pose(P,g,z){return {x:P.x-gapCenterOff(g),y:P.y,z,g};}
function buildSeq(){const a=PED[which],b=PED[1-which],O=Math.min(MODES[mode].gmax,OBJ+25);
  seq=[{to:pose(a,O,ZUP),d:1.1,txt:'approach'},{to:pose(a,O,ZGRASP),d:.8,txt:'lower'},
    {to:pose(a,OBJ,ZGRASP),d:.6,txt:'close',end:grab},{to:pose(a,OBJ,ZUP),d:.8,txt:'lift'},
    {to:pose(b,OBJ,ZUP),d:1.2,txt:'move'},{to:pose(b,OBJ,ZGRASP),d:.8,txt:'lower'},
    {to:pose(b,O,ZGRASP),d:.6,txt:'open',start:()=>{grasped=false;}},{to:pose(b,O,ZUP),d:.8,txt:'lift',end:()=>{which=1-which;}}];}
function stopPlay(){playing=false;playBtn.setAttribute('aria-pressed','false');phaseEl.textContent='';}
playBtn.onclick=()=>{if(playing){stopPlay();return;}
  const near=PED.map(P=>Math.hypot(objPos.x-P.x,objPos.y-P.y));
  if(grasped||Math.min(...near)>5){grasped=false;objPos=V(PED[0].x,PED[0].y,OBJZ);}
  which=near[0]<=near[1]?0:1;buildSeq();segI=0;segT=0;from={...st};playing=true;playBtn.setAttribute('aria-pressed','true');};
document.getElementById('reset').onclick=()=>{stopPlay();grasped=false;objPos=V(PED[0].x,PED[0].y,OBJZ);Object.assign(st,{x:0,y:0,z:-360,g:Math.min(50,MODES[mode].gmax)});sync();};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;


const tg=V(0,330,0);let th=0.55,ph=1.3,rad=1650;
function setCam(){camera.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));camera.lookAt(tg);}
const ptrs=new Map();let pinch0=0,rad0=rad;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size==2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);rad0=rad;}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size==1){th-=(e.clientX-p.x)*.008;ph=Math.min(1.55,Math.max(.15,ph-(e.clientY-p.y)*.008));}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size==2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0>0)rad=Math.min(5000,Math.max(300,rad0*pinch0/d));}
  setCam();});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{ptrs.delete(e.pointerId);pinch0=0;}));
cv.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(5000,Math.max(300,rad*(1+e.deltaY*.001)));setCam();},{passive:false});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);

applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
setCam();resize();setMode(0);

const speed=matchMedia('(prefers-reduced-motion: reduce)').matches?.4:1;
let prev=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-prev)/1000)*speed;prev=now;
  if(playing){const s=seq[segI];segT+=dt/s.d;phaseEl.textContent=s.txt;const k=ease(Math.min(1,segT));
    for(const key of ['x','y','z','g'])st[key]=from[key]+(s.to[key]-from[key])*k;
    if(segT>=1){if(s.end)s.end();segI++;segT=0;from={...st};if(segI>=seq.length){buildSeq();segI=0;}if(seq[segI].start)seq[segI].start();}
    sync();}
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
